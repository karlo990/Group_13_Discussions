<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="icon" href="img/crest.png">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Group 13 Study Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: an engineering drawing sheet. A title block heads every view; courses and modules sit in a ruled sheet index; PDFs open in a full-screen reader. */
:root {
  --paper: #EEF2F7;      /* drawing-office ground, cool blue bias */
  --sheet: #FFFFFF;
  --ink: #142033;
  --muted: #586378;
  --rule: #CDD5E1;
  --rule-strong: #8C99AE;
  --nust: #1C3F8F;       /* crest blue */
  --nust-ink: #FFFFFF;
  --gold: #D99A00;       /* crest gold */
  --gold-soft: #FFF3D1;
  --green: #2D7A4B;      /* crest green */
  --tint: #E4EBF7;
  --danger: #B3261E;
  --shadow: 0 1px 0 rgba(20,32,51,.06), 0 8px 24px -16px rgba(20,32,51,.35);
  --f-display: "Archivo", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  --f-body: "IBM Plex Sans", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #0D1420; --sheet: #141D2C; --ink: #E5EAF2; --muted: #98A4B8; --rule: #26324A; --rule-strong: #4A5A76;
  --nust: #8EB0F5; --nust-ink: #0D1420; --gold: #F0BE45; --gold-soft: #2E2611; --green: #6CC28F; --tint: #1B2740; --danger: #F2827A;
  --shadow: 0 1px 0 rgba(0,0,0,.4), 0 10px 26px -18px rgba(0,0,0,.8); color-scheme: dark; } }
:root[data-theme="dark"] {
  --paper: #0D1420; --sheet: #141D2C; --ink: #E5EAF2; --muted: #98A4B8; --rule: #26324A; --rule-strong: #4A5A76;
  --nust: #8EB0F5; --nust-ink: #0D1420; --gold: #F0BE45; --gold-soft: #2E2611; --green: #6CC28F; --tint: #1B2740; --danger: #F2827A;
  --shadow: 0 1px 0 rgba(0,0,0,.4), 0 10px 26px -18px rgba(0,0,0,.8); color-scheme: dark; }

* { box-sizing: border-box; }
html, body { background: var(--paper); }
body { color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.55; margin: 0;
  background-image: linear-gradient(var(--rule) 1px, transparent 1px), linear-gradient(90deg, var(--rule) 1px, transparent 1px);
  background-size: 32px 32px; background-attachment: fixed; background-position: -1px -1px; }
body::before { content: ""; position: fixed; inset: 0; background: var(--paper); opacity: .86; z-index: -1; pointer-events: none; }
a { color: var(--nust); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; margin: 0; letter-spacing: -.01em; }
.mono { font-family: var(--f-mono); }
.label { font-family: var(--f-mono); font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }

/* ---------- top bar ---------- */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--sheet); border-bottom: 2px solid var(--ink); }
.bar-in { max-width: 1180px; margin: 0 auto; padding: 10px 16px; display: flex; align-items: center; gap: 14px; }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--ink); flex: none; }
.brand img { width: 28px; height: 35px; object-fit: contain; }
.brand b { font-family: var(--f-display); font-stretch: 70%; font-weight: 800; font-size: 20px; letter-spacing: .02em; }
.brand b span { color: var(--gold); }
.crumbs { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 6px; min-width: 0; font-size: 13px; color: var(--muted); }
.crumbs a { color: var(--muted); text-decoration: none; padding: 2px 6px; border-radius: 4px; }
.crumbs a:hover { background: var(--tint); color: var(--ink); }
.crumbs .sep { opacity: .5; }
.crumbs .here { color: var(--ink); font-weight: 600; padding: 2px 6px; }

main > *, .sec > *, .assess > *, .two > * { min-width: 0; }
main { max-width: 1180px; margin: 0 auto; padding-inline: 16px; padding-block: 22px 64px; display: grid; gap: 26px; }

/* ---------- title block ---------- */
.tblock { background: var(--sheet); border: 2px solid var(--ink); display: grid; grid-template-columns: auto auto 1fr; box-shadow: var(--shadow); }
.tb-cell { padding: 12px 16px; border-right: 1px solid var(--ink); min-width: 0; }
.tb-cell:last-child { border-right: 0; }
.tb-crest { display: grid; place-items: center; padding: 10px 14px; }
.tb-crest img { width: 64px; height: 80px; object-fit: contain; }
.tb-num { display: grid; align-content: center; justify-items: start; }
.tb-num .label { color: var(--muted); }
.big13 { font-family: var(--f-display); font-stretch: 62%; font-weight: 900; font-size: 92px; line-height: .82; letter-spacing: -.02em; color: var(--nust); }
.big13 em { font-style: normal; color: var(--gold); }
.tb-main { display: grid; grid-template-rows: auto auto; padding: 0; }
.tb-head { padding: 14px 18px 12px; border-bottom: 1px solid var(--ink); }
.tb-head h1 { font-size: clamp(22px, 3.2vw, 32px); font-stretch: 88%; font-weight: 800; line-height: 1.05; }
.tb-head p { margin: 6px 0 0; color: var(--muted); font-size: 14px; max-width: 64ch; }
.tb-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); }
.tb-grid > div { padding: 9px 14px; border-right: 1px solid var(--rule-strong); min-width: 0; }
.tb-grid > div:last-child { border-right: 0; }
.tb-grid .v { font-family: var(--f-display); font-weight: 700; font-size: 22px; font-variant-numeric: tabular-nums; line-height: 1.15; }
.tb-grid .v.small { font-size: 14px; font-family: var(--f-body); font-weight: 600; line-height: 1.35; }

/* ---------- sections ---------- */
.sec { display: grid; gap: 12px; }
.sec-h { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 16px; border-bottom: 1px solid var(--rule-strong); padding-bottom: 6px; }
.sec-h h2 { font-size: 21px; font-stretch: 85%; font-weight: 800; }
.sec-h p { margin: 0; color: var(--muted); font-size: 13.5px; }
.panel { background: var(--sheet); border: 1px solid var(--rule-strong); }

/* course cards */
.courses { display: grid; grid-template-columns: repeat(auto-fit, minmax(270px, 1fr)); gap: 14px; }
.course { background: var(--sheet); border: 1px solid var(--rule-strong); border-top: 5px solid var(--c, var(--nust)); text-decoration: none; color: var(--ink); display: grid; grid-template-rows: auto 1fr auto; transition: transform .15s ease, box-shadow .15s ease; }
.course:hover { transform: translateY(-2px); box-shadow: var(--shadow); }
.course .top { padding: 14px 16px 6px; display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }
.course .code { font-family: var(--f-mono); font-weight: 600; font-size: 15px; color: var(--c, var(--nust)); }
.course h3 { padding: 0 16px; font-size: 19px; font-stretch: 90%; font-weight: 700; line-height: 1.2; }
.course .foot { padding: 10px 16px 14px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.chip { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 500; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--rule-strong); color: var(--muted); background: var(--sheet); white-space: nowrap; }
.chip.ok { border-color: var(--green); color: var(--green); }
.chip.warn { border-color: var(--gold); color: var(--ink); background: var(--gold-soft); }
.chip .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }

/* buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 7px 12px; border: 1px solid var(--rule-strong); background: var(--sheet); border-radius: 6px; cursor: pointer; font-size: 13.5px; font-weight: 500; text-decoration: none; color: var(--ink); white-space: nowrap; }
.btn:hover { border-color: var(--ink); }
.btn.primary { background: var(--nust); border-color: var(--nust); color: var(--nust-ink); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.gold { background: var(--gold); border-color: var(--gold); color: #1A1300; }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.ghost:hover { background: var(--tint); }
.btn[disabled] { opacity: .5; cursor: default; }
.btn svg { width: 15px; height: 15px; }

/* pack */
.pack { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 0; }
.pack > div { padding: 16px 18px; min-width: 0; }
.pack > div + div { border-left: 1px solid var(--rule); }
.pack h3 { font-size: 18px; font-stretch: 90%; }
.pack p { margin: 6px 0 12px; color: var(--muted); font-size: 14px; }
.tree { font-family: var(--f-mono); font-size: 12.5px; line-height: 1.75; color: var(--ink); margin: 0; white-space: pre; overflow-x: auto; }
.tree i { font-style: normal; color: var(--muted); }

/* course head */
.chead { background: var(--sheet); border: 2px solid var(--ink); box-shadow: var(--shadow); }
.chead-top { padding: 16px 18px; display: grid; gap: 6px; border-bottom: 1px solid var(--ink); }
.chead-top .code { font-family: var(--f-mono); font-weight: 600; color: var(--nust); font-size: 15px; }
.chead-top h1 { font-size: clamp(24px, 3.4vw, 36px); font-stretch: 84%; font-weight: 800; line-height: 1.05; }
.chead-top p { margin: 0; color: var(--muted); max-width: 70ch; font-size: 14px; }
.meta { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); }
.meta > div { padding: 9px 14px; border-right: 1px solid var(--rule-strong); min-width: 0; }
.meta > div:last-child { border-right: 0; }
.meta .v { font-weight: 600; font-size: 14px; }
.assess { padding: 12px 18px 16px; border-top: 1px solid var(--ink); display: grid; gap: 8px; }
.abar { display: flex; height: 30px; border: 1px solid var(--ink); }
.abar > div { min-width: 0; display: flex; align-items: center; padding: 0 8px; font-size: 12px; font-weight: 600; overflow: hidden; white-space: nowrap; border-right: 1px solid var(--ink); }
.abar > div:last-child { border-right: 0; }
.abar .ex { background: var(--nust); color: var(--nust-ink); }
.abar .ca { background: var(--gold-soft); color: var(--ink); }
.abar .gr { background: var(--gold); color: #1A1300; }

/* module index (sheet index) */
.mods { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 0; background: var(--sheet); border: 1px solid var(--rule-strong); }
.mod { display: grid; grid-template-columns: 52px minmax(0, 1fr); gap: 0; text-decoration: none; color: var(--ink); border-right: 1px solid var(--rule); border-bottom: 1px solid var(--rule); min-height: 112px; transition: background .12s; }
.mod:hover { background: var(--tint); }
.mod .no { font-family: var(--f-display); font-stretch: 62%; font-weight: 900; font-size: 34px; color: var(--nust); padding: 10px 0 0 12px; line-height: 1; font-variant-numeric: tabular-nums; }
.mod .body { padding: 11px 14px 12px 6px; display: grid; gap: 6px; align-content: start; min-width: 0; }
.mod h3 { font-size: 15.5px; font-stretch: 92%; font-weight: 700; line-height: 1.2; }
.mod .row { display: flex; flex-wrap: wrap; gap: 6px; }
.heat { display: flex; gap: 2px; align-items: flex-end; height: 14px; }
.heat i { width: 6px; background: var(--rule); display: block; }
.heat i.on { background: var(--gold); }

/* tabs */
.tabs { display: flex; gap: 0; border-bottom: 2px solid var(--ink); overflow-x: auto; }
.tab { padding: 8px 14px; border: 0; background: transparent; cursor: pointer; font-weight: 600; font-size: 14px; color: var(--muted); border-bottom: 3px solid transparent; margin-bottom: -2px; white-space: nowrap; }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--gold); }

/* library rows */
.lib { display: grid; }
.lrow { display: grid; grid-template-columns: 58px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--rule); }
.lrow:last-child { border-bottom: 0; }
.lrow .n { font-family: var(--f-display); font-stretch: 62%; font-weight: 900; font-size: 30px; color: var(--gold); line-height: 1; text-align: center; }
.lrow .n.doc { color: var(--nust); font-size: 15px; font-family: var(--f-mono); font-weight: 600; font-stretch: normal; }
.lrow h3 { font-size: 16px; font-stretch: 92%; font-weight: 700; }
.lrow p { margin: 2px 0 0; color: var(--muted); font-size: 13px; }
.lrow .acts { display: flex; flex-wrap: wrap; gap: 6px; justify-content: flex-end; }

/* module page */
.mhead { background: var(--sheet); border: 2px solid var(--ink); display: grid; grid-template-columns: auto minmax(0, 1fr); box-shadow: var(--shadow); }
.mhead .no { font-family: var(--f-display); font-stretch: 62%; font-weight: 900; font-size: 84px; line-height: .85; color: var(--nust); padding: 14px 18px; border-right: 1px solid var(--ink); display: grid; place-items: center; min-width: 110px; }
.mhead .txt { padding: 14px 18px; display: grid; gap: 6px; align-content: center; min-width: 0; }
.mhead h1 { font-size: clamp(22px, 3vw, 32px); font-stretch: 86%; font-weight: 800; line-height: 1.08; }
.two { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 18px; align-items: start; }
.list { display: grid; }
.li { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 10px 14px; border-bottom: 1px solid var(--rule); text-align: left; background: transparent; border-left: 0; border-right: 0; border-top: 0; cursor: pointer; width: 100%; color: var(--ink); }
.li:last-child { border-bottom: 0; }
button.li:hover { background: var(--tint); }
.li .k { font-family: var(--f-mono); font-size: 12px; color: var(--muted); white-space: nowrap; }
.li .t { font-size: 14px; min-width: 0; }
.li .pg { font-family: var(--f-mono); font-size: 12px; color: var(--nust); white-space: nowrap; }
.li.static { cursor: default; }
.grp { padding: 8px 14px; background: var(--tint); border-bottom: 1px solid var(--rule); display: flex; justify-content: space-between; gap: 8px; align-items: center; flex-wrap: wrap; }
.grp b { font-family: var(--f-display); font-stretch: 90%; font-size: 14.5px; }
.empty { padding: 18px 16px; color: var(--muted); font-size: 14px; }

/* discussion */
.disc { display: grid; }
.composer { padding: 14px 16px; border-bottom: 1px solid var(--rule); display: grid; gap: 8px; }
.composer textarea { width: 100%; min-height: 76px; resize: vertical; font: inherit; font-size: 14.5px; padding: 9px 11px; border: 1px solid var(--rule-strong); border-radius: 6px; background: var(--paper); color: var(--ink); }
.composer .row > .btn { flex: none; }
.composer .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; }
.composer select { flex: 1 1 160px; min-width: 0; width: 100%; font: inherit; font-size: 13px; padding: 6px 8px; border: 1px solid var(--rule-strong); border-radius: 6px; background: var(--sheet); color: var(--ink); max-width: 100%; }
.replying { font-size: 12.5px; color: var(--muted); display: flex; gap: 8px; align-items: center; }
.filters { display: flex; gap: 6px; flex-wrap: wrap; padding: 10px 16px; border-bottom: 1px solid var(--rule); }
.fchip { border: 1px solid var(--rule-strong); background: var(--sheet); padding: 3px 10px; border-radius: 999px; font-size: 12.5px; cursor: pointer; color: var(--muted); }
.fchip[aria-pressed="true"] { background: var(--ink); color: var(--sheet); border-color: var(--ink); }
.post { display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--rule); }
.post:last-child { border-bottom: 0; }
.post .av { width: 34px; height: 34px; border-radius: 50%; object-fit: cover; background: var(--tint); display: block; }
.post .who { display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: baseline; font-size: 13px; }
.post .who b { font-size: 14px; }
.post .who .when { color: var(--muted); font-size: 12px; }
.post .text { margin: 3px 0 4px; white-space: pre-wrap; overflow-wrap: anywhere; font-size: 14.5px; }
.post .ops { display: flex; gap: 4px; flex-wrap: wrap; }
.post .ops .btn { padding: 2px 8px; font-size: 12.5px; }
.post .replies { margin-top: 8px; border-left: 2px solid var(--rule-strong); display: grid; }
.post .replies .post { padding: 8px 0 8px 12px; border-bottom: 0; grid-template-columns: 26px minmax(0, 1fr); }
.post .replies .av { width: 26px; height: 26px; }
.tagref { font-family: var(--f-mono); font-size: 11.5px; color: var(--nust); background: var(--tint); padding: 1px 6px; border-radius: 4px; border: 0; cursor: pointer; }
.notice { padding: 10px 16px; font-size: 13px; color: var(--muted); background: var(--gold-soft); border-bottom: 1px solid var(--rule); }

/* reader */
.reader { position: fixed; inset: 0; z-index: 50; background: var(--paper); display: grid; grid-template-rows: auto minmax(0, 1fr); }
.rbar { background: var(--sheet); border-bottom: 2px solid var(--ink); padding: calc(8px + env(safe-area-inset-top, 0px)) 12px 8px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.rbar .ttl { flex: 1 1 200px; min-width: 0; }
.rbar .ttl b { display: block; font-family: var(--f-display); font-stretch: 88%; font-size: 16px; line-height: 1.2; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rbar .ttl span { font-size: 12px; color: var(--muted); }
.rbar .grpb { display: flex; gap: 4px; align-items: center; flex-wrap: wrap; }
.pgind { font-family: var(--f-mono); font-size: 12.5px; padding: 0 6px; font-variant-numeric: tabular-nums; }
.rscroll { overflow: auto; padding: 18px 12px calc(40px + env(safe-area-inset-bottom, 0px)); }
.pages { display: grid; gap: 14px; justify-content: center; }
.pg { background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.25), 0 10px 30px -18px rgba(0,0,0,.5); position: relative; }
.pg canvas { display: block; width: 100%; height: 100%; }
.pg .lk { position: absolute; display: block; border: 0; padding: 0; background: transparent; cursor: pointer; border-radius: 2px; }
.pg .lk:hover, .pg .lk:focus-visible { background: rgba(217,154,0,.22); outline: 1px solid var(--gold); }
.pg .pnum { position: absolute; right: 8px; bottom: -18px; font-family: var(--f-mono); font-size: 11px; color: var(--muted); }
.rstatus { padding: 40px 16px; text-align: center; color: var(--muted); }

.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--sheet); padding: 9px 14px; border-radius: 8px; font-size: 13.5px; z-index: 80; max-width: calc(100% - 32px); }
footer.foot { max-width: 1180px; margin: 0 auto; padding: 0 16px 40px; color: var(--muted); font-size: 12.5px; display: flex; flex-wrap: wrap; gap: 6px 18px; justify-content: space-between; }

@media (max-width: 820px) {
  .tblock { grid-template-columns: auto 1fr; }
  .tb-main { grid-column: 1 / -1; border-top: 1px solid var(--ink); }
  .tb-num { border-right: 0; }
  .tb-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .tb-grid > div:nth-child(2) { border-right: 0; }
  .tb-grid > div:nth-child(-n+2) { border-bottom: 1px solid var(--rule-strong); }
  .pack { grid-template-columns: minmax(0, 1fr); }
  .pack > div + div { border-left: 0; border-top: 1px solid var(--rule); }
  .meta { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .meta > div:nth-child(2) { border-right: 0; }
  .meta > div:nth-child(-n+2) { border-bottom: 1px solid var(--rule-strong); }
  .two { grid-template-columns: minmax(0, 1fr); }
  .lrow { grid-template-columns: 42px minmax(0, 1fr); }
  .lrow .acts { grid-column: 1 / -1; justify-content: flex-start; }
  .mhead .no { font-size: 60px; min-width: 80px; }
  .big13 { font-size: 72px; }
  .abar > div { padding: 0 4px; font-size: 11px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<header class="bar">
  <div class="bar-in">
    <a class="brand" href="#home" aria-label="Group 13 home"><img src="img/crest.png" alt="NUST crest"><b>GROUP <span>13</span></b></a>
    <nav class="crumbs" id="crumbs" aria-label="Breadcrumb"></nav>
  </div>
</header>
<main id="app"></main>
<footer class="foot"><span>Group 13 · Civil &amp; Water Engineering · NUST Faculty of Engineering</span><span>Year I · Semester I · prepared October 2026</span></footer>

async function boot() {
  if (!window.claude || !window.claude.use) return;
  try {
    const [db, user, dl] = await Promise.all([claude.use('db'), claude.use('user'), claude.use('downloads')]);

    if (user) { cap.me = await user.id(); cap.canWrite = await user.can('data.write'); }

      for (const c of COURSES) {
        db.collection('threads/' + c.id + '/posts').orderBy('at', 'desc').limit(300).onSnapshot(snap => {
          posts[c.id] = snap.docs.map(d => Object.assign({ id: d.id }, d.data()));

          refreshProfiles().then(() => rerenderDiscussion());

}

/* ---------------- downloads ---------------- */
const fileCache = new Map();
async function getBytes(url) {
  if (fileCache.has(url)) return fileCache.get(url);
  const b64 = url.endsWith('.docx') && !STANDALONE;
  const p = fetch(b64 ? url + '.b64.txt' : url).then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return b64 ? r.text() : r.arrayBuffer(); })
    .then(v => { if (!b64) return v; const bin = atob(v.trim()); const u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return u.buffer; });
  fileCache.set(url, p);
  try { return await p; } catch (e) { fileCache.delete(url); throw e; }
}
function linkDownload(url, filename) { const a = document.createElement('a'); a.href = url; a.download = filename; document.body.append(a); a.click(); a.remove(); }
async function saveFile(url, filename) {
  if (STANDALONE) { linkDownload(url, filename); return; }
  if (!cap.dl) { toast('Saving files is not available in this view.'); return; }
  try {
    toast('Preparing ' + filename + '…');
    const buf = await getBytes(url);
    await cap.dl.save({ filename, data: new Blob([buf]) });
    toast('Saved ' + filename + '.');
  } catch (e) {
    if (e && e.code === 'declined') return;
    toast(e && e.code === 'rate_limited' ? 'A save is already waiting for you to confirm.' : 'Could not save the file. Try again.');
  }
}

async function saveZip(button) {
  if (STANDALONE) { linkDownload('Group13_SCS1101_Study_Pack.zip', 'Group13_SCS1101_Study_Pack.zip'); return; }
  if (!cap.dl) { toast('Saving files is not available in this view.'); return; }
  if (button) button.disabled = true;
  try {
    toast('Building the study pack…');
    if (!window.JSZip) await loadScript('https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js');
    const zip = new JSZip(); const root = zip.folder('Group13_SCS1101_Study_Pack');
    const jobs = [];
    BOOKS.forEach(b => { jobs.push(['01_Solution_Books_PDF/' + b.file.split('/').pop(), b.file]); jobs.push(['02_Solution_Books_Word/' + b.docx.split('/').pop(), b.docx]); });
    jobs.push(['03_Notes/C_Programming_Notes_SCS1101.pdf', NOTES.file], ['03_Notes/C_Programming_Notes_SCS1101.docx', NOTES.docx], ['03_Notes/SCS1101_Field_Book_Cheat_Sheets.html', 'notes/fieldbook.html'], ['README.txt', 'notes/README.txt']);
    PAPERS.forEach(p => jobs.push(['04_Past_Papers/' + p.file.split('/').pop(), p.file]));
    jobs.push(['04_Past_Papers/SCS1100_Dec2024.pdf', 'papers/SCS1100_Dec2024.pdf'], ['04_Past_Papers/SCS1103_Nov2024.pdf', 'papers/SCS1103_Nov2024.pdf']);
    let done = 0;

    const blob = await zip.generateAsync({ type: 'blob', compression: 'DEFLATE', compressionOptions: { level: 6 } });
    await cap.dl.save({ filename: 'Group13_SCS1101_Study_Pack.zip', data: blob });
    toast('Saved the study pack.');
  } catch (e) {
    if (!(e && e.code === 'declined')) toast(e && e.code === 'rate_limited' ? 'A save is already waiting for you to confirm.' : 'Could not build the zip. Try again.');
  } finally { if (button) button.disabled = false; }

let reader = null;
async function openReader(o) {
  const R = $('#reader'); R.hidden = false; document.body.style.overflow = 'hidden';
  const token = {}; reader = token;
  const pgind = el('span', { class: 'pgind' }, '–');
  const scroll = el('div', { class: 'rscroll', tabindex: '0' });
  const pagesBox = el('div', { class: 'pages' });
  scroll.append(el('div', { class: 'rstatus' }, 'Opening…'));
  let scale = null, doc = null, observer = null, fitW = 0;
  const zoom = (f) => { if (!doc) return; const cur = currentPage(); scale = Math.max(.5, Math.min(3, (scale || 1) * f)); layout(cur); };
  const fit = () => { if (!doc) return; const cur = currentPage(); scale = null; layout(cur); };
  const close = () => { reader = null; R.hidden = true; R.replaceChildren(); document.body.style.overflow = ''; if (observer) observer.disconnect(); if (doc) doc.destroy(); document.removeEventListener('keydown', onKey); };
  const onKey = (e) => { if (e.key === 'Escape') close(); };
  document.addEventListener('keydown', onKey);
  const discuss = () => { close(); const target = o.course === 'scs1101' && o.tag && o.tag.startsWith('m') ? '#scs1101-' + o.tag : '#' + (o.course || 'scs1101'); if (location.hash !== target) location.hash = target; setTimeout(() => { const d = $('#discussion'); if (d) d.scrollIntoView({ behavior: 'smooth' }); const s = $('#post-tag'); if (s && o.tag) { const opt = [...s.options].find(x => x.value === o.tag); if (opt) s.value = o.tag; } }, 60); };
  R.replaceChildren(
    el('div', { class: 'rbar' },
      btn('Close', close, 'ghost', 'x'),
      el('div', { class: 'ttl' }, el('b', {}, o.title), el('span', {}, o.sub || '')),
      el('div', { class: 'grpb' }, btn('−', () => zoom(1 / 1.2), 'ghost'), btn('Fit', fit, 'ghost'), btn('+', () => zoom(1.2), 'ghost'), pgind),
      el('div', { class: 'grpb' },
        o.paper ? btn('Question paper', () => openReader({ file: o.paper, title: o.title.replace(/^Solution Book \d+/, 'Question paper'), sub: o.sub, course: o.course, tag: o.tag }), '', 'paper') : null,
        canSave() ? btn('Save', () => saveFile(o.file, o.file.split('/').pop()), '', 'save') : null,
        cap.db ? btn('Discuss', discuss, 'primary', 'chat') : el('a', { class: 'btn primary', href: issueUrl('[' + o.title + '] '), target: '_blank', rel: 'noopener' }, ico('chat'), 'Discuss'))),
    scroll);
  scroll.focus({ preventScroll: true });
  function currentPage() {
    const kids = [...pagesBox.children]; const top = scroll.scrollTop + 40;
    let n = 1; for (const k of kids) { if (k.offsetTop <= top) n = +k.dataset.n; else break; } return n;
  }
  scroll.addEventListener('scroll', () => { if (doc) pgind.textContent = currentPage() + ' / ' + doc.numPages; }, { passive: true });
  async function layout(goto) {
    if (observer) observer.disconnect();
    pagesBox.replaceChildren();
    const first = await doc.getPage(1); const v1 = first.getViewport({ scale: 1 });
    fitW = Math.min(scroll.clientWidth - 24, 980);
    const s = scale || fitW / v1.width;
    observer = new IntersectionObserver(entries => { for (const en of entries) if (en.isIntersecting) draw(en.target); }, { root: scroll, rootMargin: '600px 0px' });
    for (let i = 1; i <= doc.numPages; i++) {
      const box = el('div', { class: 'pg', 'data-n': String(i), style: 'width:' + Math.round(v1.width * s) + 'px;height:' + Math.round(v1.height * s) + 'px' }, el('span', { class: 'pnum' }, String(i)));
      box._s = s; pagesBox.append(box); observer.observe(box);
    }
    if (!pagesBox.isConnected) { scroll.replaceChildren(pagesBox); }
    const target = pagesBox.children[(goto || 1) - 1];
    scroll.scrollTop = target ? target.offsetTop - 12 : 0;
    pgind.textContent = (goto || 1) + ' / ' + doc.numPages;
  }
  async function draw(box) {
    if (box._drawn === box._s) return; box._drawn = box._s;
    const page = await doc.getPage(+box.dataset.n);
    const vp = page.getViewport({ scale: box._s });
    const dpr = Math.min(window.devicePixelRatio || 1, 2.5);
    const c = document.createElement('canvas'); c.width = Math.floor(vp.width * dpr); c.height = Math.floor(vp.height * dpr);
    c.setAttribute('aria-label', 'Page ' + box.dataset.n);
    const ctx = c.getContext('2d');
    await page.render({ canvasContext: ctx, viewport: vp, transform: dpr !== 1 ? [dpr, 0, 0, dpr, 0, 0] : null }).promise;
    if (reader !== token) return;
    const old = box.querySelector('canvas'); if (old) old.remove();
    box.prepend(c);
    box.querySelectorAll('.lk').forEach(x => x.remove());
    try {
      const ann = await page.getAnnotations({ intent: 'display' });
      for (const a of ann) {
        if (a.subtype !== 'Link') continue;
        const [x1, y1, x2, y2] = vp.convertToViewportRectangle(a.rect);
        const st = 'left:' + Math.min(x1, x2) + 'px;top:' + Math.min(y1, y2) + 'px;width:' + Math.abs(x2 - x1) + 'px;height:' + Math.abs(y2 - y1) + 'px';
        if (a.url) box.append(el('a', { class: 'lk', href: a.url, target: '_blank', rel: 'noopener', style: st, title: a.url, 'aria-label': 'Open ' + a.url }));
        else if (a.dest) box.append(el('button', { class: 'lk', type: 'button', style: st, 'aria-label': 'Jump in document', onclick: () => jumpTo(a.dest) }));
      }
    } catch (e) {}
  }
  async function jumpTo(dest) {
    try {
      const d = typeof dest === 'string' ? await doc.getDestination(dest) : dest;
      if (!d) return;
      const idx = typeof d[0] === 'object' ? await doc.getPageIndex(d[0]) : d[0];
      const t = pagesBox.children[idx]; if (t) scroll.scrollTop = t.offsetTop - 12;
    } catch (e) {}
  }
  try {
    const [lib, buf] = await Promise.all([loadPdfJs(), getBytes(o.file)]);
    if (reader !== token) return;
    doc = await lib.getDocument({ data: new Uint8Array(buf.slice(0)) }).promise;
    if (reader !== token) { doc.destroy(); return; }
    scroll.replaceChildren(pagesBox);
    await layout(Math.min(o.page || 1, doc.numPages));
  } catch (e) {
    if (reader !== token) return;
    scroll.replaceChildren(el('div', { class: 'rstatus' }, 'This PDF could not be opened here. ', canSave() ? btn('Save it instead', () => saveFile(o.file, o.file.split('/').pop()), 'primary', 'save') : 'Check your connection and try again.'));
  }
}

render();
boot();
})();
</script>
