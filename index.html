<title>Group 13 Study Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: a deep NUST-blue hero band carries each view's identity (crest watermark, gold "13", key figures); content sits below on a calm neutral ground in soft white cards. */
:root {
  --bg: #F3F5F9;
  --surface: #FFFFFF;
  --surface-2: #F6F8FC;
  --ink: #0F1A2E;
  --muted: #5A6579;
  --line: #E3E8F0;
  --line-strong: #CBD3E0;
  --brand: #173A8A;        /* NUST crest blue */
  --brand-ink: #FFFFFF;
  --hero: #0D2252;
  --hero-2: #17398A;
  --hero-ink: #F2F6FD;
  --hero-muted: #B4C4E6;
  --gold: #E3A500;         /* crest gold */
  --gold-ink: #1C1400;
  --gold-soft: #FFF3D3;
  --green: #22764A;        /* crest green */
  --green-soft: #E2F3E8;
  --tint: #EAF0FB;
  --danger: #B3261E;
  --shadow-sm: 0 1px 2px rgba(15,26,46,.06), 0 1px 1px rgba(15,26,46,.04);
  --shadow: 0 1px 2px rgba(15,26,46,.05), 0 12px 32px -18px rgba(15,26,46,.28);
  --radius: 16px;
  --f-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", Arial, sans-serif;
  --f-body: "Plus Jakarta Sans", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0A101B; --surface: #121A28; --surface-2: #162133; --ink: #E8EDF5; --muted: #9AA6BA; --line: #212E44; --line-strong: #33445F;
  --brand: #93B4F8; --brand-ink: #0A101B; --hero: #0C1A3B; --hero-2: #152E66; --hero-ink: #EEF3FC; --hero-muted: #A3B6DE;
  --gold: #F2C14E; --gold-ink: #1C1400; --gold-soft: #2D250F; --green: #6CC28F; --green-soft: #13281C; --tint: #18243A; --danger: #F2827A;
  --shadow-sm: 0 1px 2px rgba(0,0,0,.4); --shadow: 0 1px 2px rgba(0,0,0,.4), 0 14px 34px -20px rgba(0,0,0,.9); color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0A101B; --surface: #121A28; --surface-2: #162133; --ink: #E8EDF5; --muted: #9AA6BA; --line: #212E44; --line-strong: #33445F;
  --brand: #93B4F8; --brand-ink: #0A101B; --hero: #0C1A3B; --hero-2: #152E66; --hero-ink: #EEF3FC; --hero-muted: #A3B6DE;
  --gold: #F2C14E; --gold-ink: #1C1400; --gold-soft: #2D250F; --green: #6CC28F; --green-soft: #13281C; --tint: #18243A; --danger: #F2827A;
  --shadow-sm: 0 1px 2px rgba(0,0,0,.4); --shadow: 0 1px 2px rgba(0,0,0,.4), 0 14px 34px -20px rgba(0,0,0,.9); color-scheme: dark; }

* { box-sizing: border-box; }
html, body { background: var(--bg); }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body { -webkit-tap-highlight-color: transparent; }
body { color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.6; margin: 0; -webkit-font-smoothing: antialiased; }
a { color: var(--brand); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; border-radius: 6px; }
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; margin: 0; letter-spacing: -.015em; }
.mono { font-family: var(--f-mono); }
.label { font-family: var(--f-mono); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }

/* ---------- top bar ---------- */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: color-mix(in srgb, var(--surface) 88%, transparent); backdrop-filter: saturate(1.4) blur(10px); -webkit-backdrop-filter: saturate(1.4) blur(10px); border-bottom: 1px solid var(--line); }
.bar-in { max-width: 1180px; margin: 0 auto; padding: 10px 16px; display: flex; align-items: center; gap: 16px; }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--ink); flex: none; }
.brand img { width: 26px; height: 33px; object-fit: contain; }
.back { display: none; align-items: center; gap: 2px; color: var(--brand); font-weight: 600; font-size: 15px; text-decoration: none; margin-left: -6px; padding: 4px 6px; border-radius: 10px; }
.back svg { width: 22px; height: 22px; }
.brand b { font-family: var(--f-display); font-weight: 800; font-size: 19px; letter-spacing: -.01em; }
.brand b span { color: var(--gold); }
.crumbs { display: flex; flex-wrap: wrap; align-items: center; gap: 2px 4px; min-width: 0; font-size: 13px; color: var(--muted); }
.crumbs a { color: var(--muted); text-decoration: none; padding: 3px 8px; border-radius: 999px; }
.crumbs a:hover { background: var(--tint); color: var(--ink); }
.crumbs .sep { opacity: .45; }
.crumbs .here { color: var(--ink); font-weight: 600; padding: 3px 8px; background: var(--tint); border-radius: 999px; }

/* ---------- hero band ---------- */
.hero { position: relative; overflow: hidden; color: var(--hero-ink); background:
  radial-gradient(600px 300px at 88% -10%, color-mix(in srgb, var(--gold) 26%, transparent), transparent 70%),
  linear-gradient(160deg, var(--hero-2), var(--hero) 62%); }
.hero::after { content: ""; position: absolute; right: -30px; bottom: -70px; width: 260px; height: 330px; background: url("img/crest-hd.png") center / contain no-repeat; opacity: .08; filter: grayscale(1) brightness(1.8); pointer-events: none; }
.hero.home::after { display: none; }
.emblem { width: 112px; height: auto; filter: drop-shadow(0 10px 24px rgba(0,0,0,.35)); justify-self: end; }
.emblem-wrap { display: grid; place-items: center; width: 150px; height: 150px; border-radius: 50%; background: radial-gradient(closest-side, color-mix(in srgb, var(--hero-ink) 16%, transparent), transparent); }
.hero-in { position: relative; z-index: 1; max-width: 1180px; margin: 0 auto; padding-inline: 16px; padding-block: 26px 24px; display: grid; gap: 16px; }
.hero .eyebrow { font-family: var(--f-mono); font-size: 11.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--hero-muted); display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; }
.hero .eyebrow .pill { border: 1px solid color-mix(in srgb, var(--hero-ink) 28%, transparent); padding: 2px 10px; border-radius: 999px; color: var(--hero-ink); letter-spacing: .08em; }
.hero h1 { font-size: clamp(28px, 4vw, 42px); font-weight: 800; line-height: 1.02; color: var(--hero-ink); }
.hero p.lead { margin: 0; color: var(--hero-muted); font-size: 16px; max-width: 60ch; }
.hero-top { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 22px; align-items: center; }
.big13 { font-family: var(--f-display); font-weight: 800; font-size: clamp(72px, 9vw, 112px); line-height: .8; letter-spacing: -.05em; color: var(--gold); text-shadow: 0 10px 40px rgba(0,0,0,.25); }
.stats { display: flex; flex-wrap: wrap; gap: 10px; }
.stat { background: color-mix(in srgb, var(--hero-ink) 9%, transparent); border: 1px solid color-mix(in srgb, var(--hero-ink) 16%, transparent); border-radius: 12px; padding: 9px 14px; min-width: 120px; }
.stat .k { font-family: var(--f-mono); font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--hero-muted); }
.stat .v { font-family: var(--f-display); font-weight: 700; font-size: 22px; line-height: 1.2; font-variant-numeric: tabular-nums; color: var(--hero-ink); }
.stat .v.small { font-size: 15px; font-family: var(--f-body); font-weight: 600; line-height: 1.5; }
.hero .code { font-family: var(--f-mono); font-weight: 600; font-size: 13px; color: var(--gold); letter-spacing: .04em; }
.hero-mod { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 18px; align-items: center; }
.hero-mod .no { font-family: var(--f-display); font-weight: 800; font-size: clamp(56px, 7vw, 84px); line-height: .85; color: var(--gold); letter-spacing: -.04em; font-variant-numeric: tabular-nums; }
.abar { display: flex; height: 34px; border-radius: 10px; overflow: hidden; gap: 2px; background: color-mix(in srgb, var(--hero-ink) 14%, transparent); }
.abar > div { min-width: 0; display: flex; align-items: center; padding: 0 10px; font-size: 12px; font-weight: 600; overflow: hidden; white-space: nowrap; }
.abar .ex { background: var(--hero-ink); color: var(--hero); }
.abar .ca { background: color-mix(in srgb, var(--hero-ink) 22%, transparent); color: var(--hero-ink); }
.abar .gr { background: var(--gold); color: var(--gold-ink); }

main { max-width: 1180px; margin: 0 auto; padding-inline: 16px; padding-block: 28px 64px; display: grid; gap: 34px; }
main > *, .sec > *, .two > * { min-width: 0; }

/* ---------- sections ---------- */
.sec { display: grid; gap: 14px; }
.sec-h { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 4px 16px; }
.sec-h h2 { font-size: 22px; font-weight: 700; }
.sec-h p { margin: 0; color: var(--muted); font-size: 13.5px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow-sm); overflow: hidden; }

/* course cards */
.courses { display: grid; grid-template-columns: repeat(auto-fit, minmax(270px, 1fr)); gap: 16px; }
.course { position: relative; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow-sm); text-decoration: none; color: var(--ink); display: grid; grid-template-rows: auto 1fr auto; gap: 10px; padding: 18px; transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease; overflow: hidden; }
.course::before { content: ""; position: absolute; inset: 0 0 auto 0; height: 4px; background: var(--c, var(--brand)); }
@media (hover: hover) { .course:hover { transform: translateY(-3px); box-shadow: var(--shadow); border-color: var(--line-strong); } }
.course:active, .mod:active, button.li:active, .lrow:active { transform: scale(.985); }
.course .top { display: flex; justify-content: space-between; gap: 10px; align-items: center; }
.badge { width: 42px; height: 42px; border-radius: 12px; display: grid; place-items: center; font-family: var(--f-display); font-weight: 800; font-size: 15px; color: #fff; background: var(--c, var(--brand)); flex: none; }
.course .code { font-family: var(--f-mono); font-weight: 600; font-size: 13px; color: var(--muted); }
.course h3 { font-size: 20px; font-weight: 700; line-height: 1.2; }
.course .foot { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; justify-content: space-between; }
.course .go { font-size: 13px; font-weight: 600; color: var(--brand); }
.chip { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 999px; background: var(--surface-2); color: var(--muted); white-space: nowrap; border: 1px solid var(--line); }
.chip.ok { background: var(--green-soft); color: var(--green); border-color: transparent; }
.chip.warn { background: var(--gold-soft); color: var(--ink); border-color: transparent; }
.chip .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.hero .chip { background: color-mix(in srgb, var(--hero-ink) 12%, transparent); color: var(--hero-ink); border-color: transparent; }
.hero .chip.ok { background: color-mix(in srgb, var(--green) 30%, transparent); }

/* buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; padding: 8px 14px; border: 1px solid var(--line-strong); background: var(--surface); border-radius: 10px; cursor: pointer; font-size: 13.5px; font-weight: 600; text-decoration: none; color: var(--ink); white-space: nowrap; transition: background .15s, border-color .15s, transform .1s; }
.btn:hover { border-color: var(--ink); }
.btn:active { transform: translateY(1px); }
.btn.primary { background: var(--brand); border-color: var(--brand); color: var(--brand-ink); }
.btn.primary:hover { filter: brightness(1.1); }
.btn.gold { background: var(--gold); border-color: var(--gold); color: var(--gold-ink); }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.ghost:hover { background: var(--tint); }
.btn[disabled] { opacity: .5; cursor: default; }
.btn svg { width: 15px; height: 15px; }

/* pack */
.pack { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); }
.pack > div { padding: 20px 22px; min-width: 0; }
.pack > div + div { border-left: 1px solid var(--line); background: var(--surface-2); }
.pack h3 { font-size: 19px; }
.pack p { margin: 6px 0 14px; color: var(--muted); font-size: 14px; }
.tree { font-family: var(--f-mono); font-size: 12.5px; line-height: 1.8; color: var(--ink); margin: 0; white-space: pre; overflow-x: auto; }
.tree i { font-style: normal; color: var(--muted); }

/* course meta */
.meta { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.meta > div { background: color-mix(in srgb, var(--hero-ink) 8%, transparent); border: 1px solid color-mix(in srgb, var(--hero-ink) 14%, transparent); border-radius: 12px; padding: 9px 13px; min-width: 0; }
.meta .label { color: var(--hero-muted); }
.meta .v { font-weight: 600; font-size: 14px; color: var(--hero-ink); }

/* module cards */
.mods { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
.mod { display: grid; grid-template-columns: 46px minmax(0, 1fr); gap: 12px; text-decoration: none; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; box-shadow: var(--shadow-sm); transition: transform .16s ease, box-shadow .16s ease, border-color .16s; }
@media (hover: hover) { .mod:hover { transform: translateY(-2px); box-shadow: var(--shadow); border-color: var(--line-strong); } }
.mod .no { width: 46px; height: 46px; border-radius: 12px; display: grid; place-items: center; font-family: var(--f-display); font-weight: 800; font-size: 18px; color: var(--brand); background: var(--tint); font-variant-numeric: tabular-nums; }
.mod .body { display: grid; gap: 8px; align-content: start; min-width: 0; }
.mod h3 { font-size: 15.5px; font-weight: 700; line-height: 1.25; }
.mod .row { display: flex; flex-wrap: wrap; gap: 6px; }
.heat { display: flex; gap: 3px; align-items: center; }
.heat i { width: 14px; height: 6px; border-radius: 3px; background: var(--line); display: block; }
.heat i.on { background: var(--gold); }

/* tabs */
.tabs { display: inline-flex; gap: 4px; padding: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow-x: auto; max-width: 100%; justify-self: start; }
.tab { padding: 7px 14px; border: 0; background: transparent; cursor: pointer; font-weight: 600; font-size: 13.5px; color: var(--muted); border-radius: 9px; white-space: nowrap; }
.tab[aria-selected="true"] { color: var(--brand-ink); background: var(--brand); }

/* library rows */
.lib { display: grid; }
.lrow { display: grid; grid-template-columns: 50px minmax(0, 1fr) auto; gap: 14px; align-items: center; padding: 14px 18px; border-bottom: 1px solid var(--line); }
.lrow:last-child { border-bottom: 0; }
.lrow.hot { background: color-mix(in srgb, var(--gold) 12%, var(--surface, #fff)); box-shadow: inset 4px 0 0 var(--gold); }
.lrow.hot .n { font-size: 13px; letter-spacing: .06em; background: var(--gold); color: #fff; }
.spot-new.red { border-color: var(--danger); background: color-mix(in srgb, var(--danger) 9%, var(--surface, #fff)); }
.spot-new.red .ic { background: var(--danger); }
.chip.new.red { background: var(--danger); }
.lrow.hot.red { background: color-mix(in srgb, var(--danger) 9%, var(--surface, #fff)); box-shadow: inset 4px 0 0 var(--danger); }
.lrow.hot.red .n { background: var(--danger); }
.chip.new { background: var(--gold); color: #fff; border-color: transparent; font-weight: 800; letter-spacing: .04em; }
.spot-new { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 16px; align-items: center; padding: 16px 18px; border-radius: 16px; border: 2px solid var(--gold); background: color-mix(in srgb, var(--gold) 10%, var(--surface, #fff)); }
.spot-new .ic { width: 52px; height: 52px; border-radius: 14px; display: grid; place-items: center; background: var(--gold); color: #fff; font-family: var(--f-mono); font-weight: 800; font-size: 18px; }
.spot-new h3 { font-size: 17px; font-weight: 800; margin: 4px 0 2px; }
.spot-new p { margin: 0; color: var(--muted); font-size: 13.5px; }
.spot-new .acts { display: flex; flex-wrap: wrap; gap: 6px; justify-content: flex-end; }
@media (max-width: 640px) { .spot-new { grid-template-columns: 1fr; } .spot-new .ic { display: none; } .spot-new .acts { justify-content: flex-start; } }
.lrow:hover { background: var(--surface-2); }
.lrow .n { width: 50px; height: 50px; border-radius: 14px; display: grid; place-items: center; font-family: var(--f-display); font-weight: 800; font-size: 22px; color: var(--gold-ink); background: var(--gold-soft); }
.lrow .n.doc { color: var(--brand); background: var(--tint); font-size: 12px; font-family: var(--f-mono); font-weight: 600; }
.lrow h3 { font-size: 16px; font-weight: 700; }
.lrow p { margin: 2px 0 0; color: var(--muted); font-size: 13px; }
.lrow .acts { display: flex; flex-wrap: wrap; gap: 6px; justify-content: flex-end; }

/* module page */
.two { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 22px; align-items: start; }
.list { display: grid; }
.li { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 11px 16px; border-bottom: 1px solid var(--line); text-align: left; background: transparent; border-left: 0; border-right: 0; border-top: 0; cursor: pointer; width: 100%; color: var(--ink); }
.li:last-child { border-bottom: 0; }
button.li:hover { background: var(--surface-2); }
.li .k { font-family: var(--f-mono); font-size: 12px; color: var(--muted); white-space: nowrap; }
.li .t { font-size: 14px; min-width: 0; }
.li .pg { font-family: var(--f-mono); font-size: 11.5px; color: var(--brand); background: var(--tint); padding: 2px 8px; border-radius: 999px; white-space: nowrap; }
.li.static { cursor: default; }
.grp { padding: 10px 16px; background: var(--surface-2); border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; gap: 8px; align-items: center; flex-wrap: wrap; }
.grp b { font-family: var(--f-display); font-size: 14.5px; }
.empty { padding: 20px 18px; color: var(--muted); font-size: 14px; }
.pager { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }

/* discussion */
.disc { display: grid; }
.composer { padding: 16px 18px; border-bottom: 1px solid var(--line); display: grid; gap: 10px; }
.composer textarea { width: 100%; min-height: 80px; resize: vertical; font: inherit; font-size: 14.5px; padding: 10px 12px; border: 1px solid var(--line-strong); border-radius: 12px; background: var(--surface-2); color: var(--ink); }
.composer .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; }
.composer .row > .btn { flex: none; }
.composer select { flex: 1 1 160px; min-width: 0; width: 100%; font: inherit; font-size: 13px; padding: 7px 10px; border: 1px solid var(--line-strong); border-radius: 10px; background: var(--surface); color: var(--ink); max-width: 100%; }
.replying { font-size: 12.5px; color: var(--muted); display: flex; gap: 8px; align-items: center; }
.filters { display: flex; gap: 6px; flex-wrap: wrap; padding: 12px 18px; border-bottom: 1px solid var(--line); }
.fchip { border: 1px solid var(--line-strong); background: var(--surface); padding: 4px 11px; border-radius: 999px; font-size: 12.5px; cursor: pointer; color: var(--muted); font-weight: 600; }
.fchip[aria-pressed="true"] { background: var(--brand); color: var(--brand-ink); border-color: var(--brand); }
.post { display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 12px; padding: 14px 18px; border-bottom: 1px solid var(--line); }
.post:last-child { border-bottom: 0; }
.post .av { width: 34px; height: 34px; border-radius: 50%; object-fit: cover; background: var(--tint); display: block; }
.post .who { display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: baseline; font-size: 13px; }
.post .who b { font-size: 14px; }
.post .who .when { color: var(--muted); font-size: 12px; }

/* ---------------- downloads ---------------- */
const fileCache = new Map();
async function getBytes(url) {
  if (fileCache.has(url)) return fileCache.get(url);
  const b64 = url.endsWith('.docx') && !STANDALONE;
  const p = fetch(b64 ? url + '.b64.txt' : url).then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return b64 ? r.text() : r.arrayBuffer(); })
    .then(v => { if (!b64) return v; const bin = atob(v.trim()); const u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return u.buffer; });
  fileCache.set(url, p);
  try { return await p; } catch (e) { fileCache.delete(url); throw e; }
}
function linkDownload(url, filename) { const a = document.createElement('a'); a.href = url; a.download = filename; document.body.append(a); a.click(); a.remove(); }
async function saveFile(url, filename) {
  if (STANDALONE) { linkDownload(url, filename); return; }
  if (!cap.dl) { toast('Saving files is not available in this view.'); return; }
  try {
    toast('Preparing ' + filename + '…');
    const buf = await getBytes(url);
    await cap.dl.save({ filename, data: new Blob([buf]) });
    toast('Saved ' + filename + '.');
  } catch (e) {
    if (e && e.code === 'declined') return;
    toast(e && e.code === 'rate_limited' ? 'A save is already waiting for you to confirm.' : 'Could not save the file. Try again.');
  }
}

async function saveZip(button) {
  if (STANDALONE) { linkDownload('Group13_SCS1101_Study_Pack.zip', 'Group13_SCS1101_Study_Pack.zip'); return; }
  if (!cap.dl) { toast('Saving files is not available in this view.'); return; }
  if (button) button.disabled = true;
  try {
    toast('Building the study pack…');
    if (!window.JSZip) await loadScript('https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js');
    const zip = new JSZip(); const root = zip.folder('Group13_SCS1101_Study_Pack');
    const jobs = [];
    BOOKS.forEach(b => { jobs.push(['01_Solution_Books_PDF/' + b.file.split('/').pop(), b.file]); jobs.push(['02_Solution_Books_Word/' + b.docx.split('/').pop(), b.docx]); });
    jobs.push(['03_Notes/C_Programming_Notes_SCS1101.pdf', NOTES.file], ['03_Notes/C_Programming_Notes_SCS1101.docx', NOTES.docx], ['03_Notes/SCS1101_Field_Book_Cheat_Sheets.html', 'notes/fieldbook.html'], ['README.txt', 'notes/README.txt']);
    PAPERS.forEach(p => jobs.push(['04_Past_Papers/' + p.file.split('/').pop(), p.file]));
    let done = 0;

  } finally { if (button) button.disabled = false; }
}

      for (const a of ann) {
        if (a.subtype !== 'Link') continue;
        const [x1, y1, x2, y2] = vp.convertToViewportRectangle(a.rect);
        const st = 'left:' + Math.min(x1, x2) + 'px;top:' + Math.min(y1, y2) + 'px;width:' + Math.abs(x2 - x1) + 'px;height:' + Math.abs(y2 - y1) + 'px';
        if (a.url) box.append(el('a', { class: 'lk', href: a.url, target: '_blank', rel: 'noopener', style: st, title: a.url, 'aria-label': 'Open ' + a.url }));
        else if (a.dest) box.append(el('button', { class: 'lk', type: 'button', style: st, 'aria-label': 'Jump in document', onclick: () => jumpTo(a.dest) }));
      }
    } catch (e) {}
  }
  async function jumpTo(dest) {
    try {
      const d = typeof dest === 'string' ? await doc.getDestination(dest) : dest;
      if (!d) return;
      const idx = typeof d[0] === 'object' ? await doc.getPageIndex(d[0]) : d[0];
      const t = pagesBox.children[idx]; if (t) scroll.scrollTop = t.offsetTop - 12;
    } catch (e) {}
  }
  try {
    const [lib, buf] = await Promise.all([loadPdfJs(), getBytes(o.file)]);
    if (reader !== token) return;
    doc = await lib.getDocument({ data: new Uint8Array(buf.slice(0)) }).promise;
    if (reader !== token) { doc.destroy(); return; }
    scroll.replaceChildren(pagesBox);
    await layout(Math.min(o.page || 1, doc.numPages));
  } catch (e) {
    if (reader !== token) return;
    scroll.replaceChildren(el('div', { class: 'rstatus' }, 'This PDF could not be opened here. ', canSave() ? btn('Save it instead', () => saveFile(o.file, o.file.split('/').pop()), 'primary', 'save') : 'Check your connection and try again.'));
  }
}

render();
boot();
})();
</script>

</body>
</html>
